<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>กรอกข้อมูลจัดส่ง</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>ยืนยันการสั่งซื้อ</h1>
    </header>

    <div class="container" style="background: white; padding: 20px; border-radius: 12px; max-width: 500px;">
        <div style="background: #fff3e0; padding: 12px; border-radius: 6px; margin-bottom: 20px;">
            <strong>รายการที่เลือก:</strong> <span id="summaryOrder">-</span><br>
            <strong>ยอดที่ต้องชำระ:</strong> <span id="summaryPrice" style="color: #e65100; font-weight: bold;">-</span>
        </div>

        <form onsubmit="submitOrder(event)">
            <div class="form-group">
                <label>ชื่อ-นามสกุล ผู้รับ:</label>
                <input type="text" id="name" required placeholder="เช่น สมชาย ใจดี">
            </div>
            <div class="form-group">
                <label>เบอร์โทรศัพท์:</label>
                <input type="tel" id="phone" required placeholder="08X-XXX-XXXX">
            </div>
            <div class="form-group">
                <label>ที่อยู่จัดส่ง / ระบุจุดสังเกต:</label>
                <textarea id="address" rows="3" required placeholder="บ้านเลขที่ ซอย ถนน หรือชื่อคอนโด/จุดสังเกต"></textarea>
            </div>
            <div class="form-group">
                <label>หมายเหตุเพิ่มเติมถึงร้าน:</label>
                <input type="text" id="notes" placeholder="เช่น ไม่ใส่ผักชี, ขอพริกปรุงเพิ่ม">
            </div>

            <button type="submit" class="btn" id="submitBtn">ยืนยันการสั่งซื้อทันที</button>
        </form>
    </div>

    <script src="script.js"></script>
    <script>
        document.getElementById('summaryOrder').innerText = localStorage.getItem('currentOrderDetails') || '-';
        document.getElementById('summaryPrice').innerText = (localStorage.getItem('currentTotalPrice') || '0') + ' บาท';
    </script>
</body>
</html>
